{% extends "base.html" %}

{% block title %}
Login | CampusEquip
{% endblock %}


{% block public_content %}

<div class="public-page">

    <div class="auth-card">

        <!-- BRAND -->

        <div class="auth-brand">

            <div class="brand-icon">
                CE
            </div>

            <h1>
                CampusEquip
            </h1>

            <p>
                Campus Equipment Booking & Return System
            </p>

        </div>


        <!-- LOGIN -->

        <div class="card-header">

            <div>

                <div class="card-title">
                    Welcome back
                </div>

                <div class="card-subtitle">
                    Sign in to continue to your account.
                </div>

            </div>

        </div>


        <form method="POST">

            <!-- USERNAME -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="username"
                >
                    Username
                </label>


                <input
                    class="form-control"
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="password"
                >
                    Password
                </label>


                <input
                    class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn btn-primary"
                style="width: 100%;"
            >

                Sign In

            </button>

        </form>


        <!-- REGISTER LINK -->

        <div class="divider"></div>


        <p
            style="
                text-align: center;
                color: var(--espresso-muted);
                font-size: 12px;
            "
        >

            Don't have an account?

            <a
                href="{{ url_for('main.register') }}"
                style="
                    color: var(--terracotta);
                    font-weight: 700;
                "
            >

                Create one

            </a>

        </p>

    </div>

</div>

{% endblock %}
